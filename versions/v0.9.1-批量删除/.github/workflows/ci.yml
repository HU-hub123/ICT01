name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: 单测（断言 + 存储适配器）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行单测（不联网）
        run: pnpm test

  build:
    name: 构建
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查与生产构建
        run: pnpm build

  eval:
    name: 推理评测（需要配置 DEEPSEEK_API_KEY）
    needs: build
    runs-on: ubuntu-latest
    env:
      EVAL_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm build

      - name: 启动服务并等待就绪
        if: env.EVAL_KEY != ''
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          PORT=3100 nohup pnpm start > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3100/api/models > /dev/null; then echo ready; break; fi
            sleep 2
          done
          curl -sf http://localhost:3100/api/models > /dev/null || (cat server.log; exit 1)

      - name: 运行评测（8 题冒烟）
        if: env.EVAL_KEY != ''
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BASE_URL: http://localhost:3100
          LIMIT: "8"
        run: |
          node eval/run-eval.mjs
          cat server.log | tail -50

      - name: 上传评测报告
        if: env.EVAL_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/*.json
          if-no-files-found: ignore
